<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sticker Sheet Optimizer</title>
<style>
  :root { --bg:#16181d; --panel:#1f232b; --line:#323846; --text:#e6e8ee; --dim:#8b93a5; --accent:#5aa9ff; --good:#58c36b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif; }
  #app { display:grid; grid-template-columns:330px 330px minmax(380px,1fr); gap:12px; padding:12px; align-items:start; }
  @media (max-width:1100px) { #app { grid-template-columns:1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  h2 { margin:14px 0 8px; font-size:14px; letter-spacing:.04em; text-transform:uppercase; }
  h2:first-child { margin-top:0; }
  small, .dim { color:var(--dim); font-size:12px; }
  input, select, button { font:inherit; color:var(--text); background:#2a303b; border:1px solid var(--line); border-radius:5px; padding:5px 8px; }
  input[type=text], input[type=number], select { width:100%; margin:3px 0; }
  input[type=checkbox] { width:auto; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#06121f; border-color:var(--accent); }
  button.primary { background:var(--good); color:#06180b; border-color:var(--good); font-weight:700; width:100%; padding:9px; margin-top:8px; }
  button.danger { padding:2px 8px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:3px 0; }
  .seg { display:flex; margin:4px 0; }
  .seg button { flex:1; border-radius:0; }
  .seg button:first-child { border-radius:5px 0 0 5px; } .seg button:last-child { border-radius:0 5px 5px 0; }
  .grid { display:grid; gap:2px; width:max-content; margin:4px 0; }
  .cell { border:0; padding:0; border-radius:3px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#111; }
  .cell.avail { background:#58c36b; } .cell.blocked { background:#23262e; }
  .sol { display:block; width:100%; text-align:left; margin:4px 0; padding:8px; white-space:pre-line; }
  .sol.sel { border-color:var(--accent); background:#243247; }
  .legend { display:flex; align-items:flex-start; gap:8px; margin:5px 0; }
  .legend .cell { width:22px; height:22px; flex:none; font-size:12px; }
  #status { margin:4px 0 8px; color:var(--dim); }
  #list { max-height:260px; overflow:auto; }
  label.chk { display:flex; gap:6px; align-items:center; margin:4px 0; }
  ul.fx { margin:4px 0; padding-left:18px; }
  .priority-list { margin:6px 0 8px; padding:0; list-style:none; }
  .priority-item { display:flex; align-items:center; gap:8px; padding:6px 8px; margin:3px 0; background:#2a303b; border:1px solid var(--line); border-radius:5px; cursor:grab; transition:transform 160ms ease, opacity 160ms ease; }
  .priority-item.dragging { opacity:1; }
  .priority-item.priority-animating { transition:transform 160ms ease; }
  .priority-drag-clone { background:#2a303b; border:1px solid var(--line); border-radius:5px; box-shadow:0 8px 20px rgba(0,0,0,.35); opacity:.98; }
  .priority-list { position:relative; }
  .priority-item { user-select:none; touch-action:none; }
  .priority-handle { color:var(--dim); user-select:none; }
</style>
</head>
<body>
<div id="app">
  <section>
    <h2>2. Create sticker</h2>
    <div id="form"></div>
  </section>
  <section>
    <h2>3. Sticker Sheet<br><small>(green = sticker placement allowed)</small></h2>
    <div id="sheet"></div>
    <h2>4. Stickers<br><small>(select stickers to place)</small></h2>
    <div id="stickers"></div>
    <div id="opts"></div>
  </section>
  <section>
    <h2>5. Results</h2>
    <div id="status"></div>
    <div id="results"></div>
  </section>
</div>

<script src="stickers.js"></script>
<script src="solver.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var RAR = ['Common', 'Rare', 'Epic'], TIERS = ['rare', 'epic'], KEY = 'stickersheetV3';
  var SORTS = ['Overall Best', 'Highest Stats', 'Balance', 'Highest Rarity'];

  // ---------- sticker data (from stickers.js) ----------
  // '{20}% Primary Monkey Attack Speed' -> stacking effect { text: '{v}% Primary Monkey Attack Speed', value: 20 }
  function parseEffect(str) {
    var m = /\{(-?[\d.]+)\}/.exec(str);
    return m ? { text: str.replace(m[0], '{v}'), value: parseFloat(m[1]), stack: true } : { text: str, value: 0, stack: false };
  }
  var PRESETS = STICKERS.map(function (s) {
    var cells = [];
    s.shape.forEach(function (r, y) { for (var x = 0; x < r.length; x++) if (r.charAt(x) === 'X') cells.push([x, y]); });
    return { name: s.name, base: s.base, lamp: s.base === 'Effectiveness', cells: cells, tiers: [parseEffect(s.rare), parseEffect(s.epic)] };
  });
  function preset(name) { return PRESETS.filter(function (p) { return p.name === name; })[0]; }
  // Solver stat name -> parsed effect, e.g. 'Wheely Fast|rare'. Keyed per sticker, so only the exact same sticker stacks.
  var EFFECTS = {};
  PRESETS.forEach(function (p) { p.tiers.forEach(function (t, i) { EFFECTS[p.name + '|' + TIERS[i]] = t; }); });

  var state = { stickers: [], sheet: Array(30).fill(true), counters: {}, statPriority: [] };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && saved.stickers) {
      state = saved;
      state.sheet = Array.isArray(saved.sheet) && saved.sheet.length === 30 ? saved.sheet : Array(30).fill(true);
      state.counters = saved.counters || {};
    }
  } catch (e) {}
  // Saved stickers keep only type / rarity / value; shape and effects always come from stickers.js.
  state.stickers = state.stickers.filter(function (s) {
    if (!preset(s.type)) { console.warn('Dropped saved sticker with unknown type: ' + s.type); return false; }
    if (s.value === undefined) s.value = s.isLamp ? s.lampBoost : s.effects[0].value;
    return true;
  });
  function baseStats() {
    var seen = {};
    var out = [];
    state.stickers.forEach(function (s) {
      var p = preset(s.type);
      if (!p || p.lamp || p.base === 'Effectiveness' || seen[p.base]) return;
      seen[p.base] = true;
      out.push(p.base);
    });
    return out;
  }

  // Preserve the user's existing order, append newly encountered base stats,
  // and remove stats no longer represented by any sticker.
  function normalizeStatPriority() {
    var available = baseStats(), seen = {};
    var ordered = [];
    (state.statPriority || []).forEach(function (n) {
      if (available.indexOf(n) >= 0 && !seen[n]) {
        seen[n] = true;
        ordered.push(n);
      }
    });
    available.forEach(function (n) {
      if (!seen[n]) {
        seen[n] = true;
        ordered.push(n);
      }
    });
    state.statPriority = ordered;
  }
  normalizeStatPriority();

  var form = { type: '', rarity: 1, val: '' };
  var opts = { requireAll: false };
  var worker = null, solving = false, results = [], sortMode = 0, sel = 0, statusMsg = '';

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(v) { return String(Math.round(v * 100) / 100); }
  function num(v) { return v.toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function setStatus(m) { statusMsg = m; $('status').textContent = m; }
  function color(p, i) { return p.def.isLamp ? '#ffe066' : 'hsl(' + ((i * 114.5) % 360) + ',55%,72%)'; }

  function statText(name, v) { return fmt(v) + '% ' + name; }
  // total = summed number for stacking effects, copy count for the others
  function tierText(t, total) { return t.stack ? t.text.replace('{v}', num(total)) : t.text + (total > 1 ? ' x' + total : ''); }
  function tierOne(t) { return tierText(t, t.stack ? t.value : 1); }
  function effectsText(s) {
    var p = preset(s.type);
    return [fmt(s.value) + '% ' + p.base].concat(p.tiers.slice(0, s.rarity - 1).map(tierOne)).join(', ');
  }

  // Sticker as the solver wants it, built from the saved sticker plus stickers.js
  function solverDef(s) {
    var p = preset(s.type);
    var d = { name: s.name, rarity: s.rarity, isLamp: p.lamp, cells: p.cells, effects: [], lampBoost: p.lamp ? s.value : 0 };
    if (!p.lamp) {
      d.effects.push({ stat: p.base, value: s.value });
      for (var i = 0; i < s.rarity - 1; i++) d.effects.push({ stat: p.name + '|' + TIERS[i], value: p.tiers[i].value });
    }
    return d;
  }

  // ---------- renderers ----------
  function renderForm() {
    var p = preset(form.type);
    var h = '<select data-bind="preset"><option value="">— pick a sticker —</option>' + PRESETS.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (x) {
      return '<option value="' + esc(x.name) + '"' + (x.name === form.type ? ' selected' : '') + '>' + esc(x.name) + '</option>';
    }).join('') + '</select>' +
      '<div class="seg">' + RAR.map(function (r, i) { return '<button data-a="formRarity" data-v="' + (i + 1) + '" class="' + (form.rarity === i + 1 ? 'on' : '') + '">' + r + '</button>'; }).join('') + '</div>';
    if (p) {
      h += '<div class="row"><small>' + esc(p.base) + ' %</small><input type="number" step="any" min="0" data-bind="val" style="width:90px" value="' + esc(form.val) + '"></div>';
      if (form.rarity >= 2) {
        h += '<ul class="fx">' + p.tiers.slice(0, form.rarity - 1).map(function (t) { return '<li><small>' + esc(tierOne(t)) + '</small></li>'; }).join('') + '</ul>';
      }
    }
    h += '<button class="primary" data-a="createSticker">Create sticker</button>';
    $('form').innerHTML = h;
  }

  function rendersheet() {
    var h = '<div class="grid" style="grid-template-columns:repeat(6,44px)">';
    for (var i = 0; i < 30; i++) h += '<button class="cell ' + (state.sheet[i] ? 'avail' : 'blocked') + '" style="width:44px;height:44px" data-a="sheet" data-i="' + i + '"></button>';
    $('sheet').innerHTML = h + '</div><button data-a="sheetAll">Make all squares available</button>';
  }

  function renderStickers() {
    $('stickers').innerHTML = state.stickers.length ? state.stickers.map(function (s, i) {
      var p = preset(s.type);
      return '<div class="row"><label class="chk" style="margin:0"><input type="checkbox" data-a="toggle" data-i="' + i + '"' + (s.include ? ' checked' : '') + '>' +
             '<div><div>' + esc(s.name) + ' <small>(' + (p.lamp ? 'Glow Up ' : '') + RAR[s.rarity - 1] + ', ' + p.cells.length + ' sq)</small></div><small>' + esc(effectsText(s)) + '</small></div></label>' +
             '<button class="danger" data-a="delSticker" data-i="' + i + '">×</button></div>';
    }).join('') : '<small>None yet.</small>';
    var priorities = state.statPriority || [];
    var priorityHtml = priorities.length
      ? '<ul id="priority-list" class="priority-list">' + priorities.map(function (name, i) {
          return '<li class="priority-item" draggable="true" data-priority="' + esc(name) + '" data-priority-index="' + i + '">' +
            '<span class="priority-handle">&#9776;</span><span class="priority-rank">#' + (i + 1) + '</span><span>' + esc(name) + '</span></li>';
        }).join('') + '</ul>'
      : '<small>No base common stats yet.</small>';

    $('opts').innerHTML =
      '<h2>Highest Stats priority</h2>' +
      '<small>Drag stats to choose the order optimized by Highest Stats. Effectiveness is excluded because Glow Ups boost other stats.</small>' +
      priorityHtml +
      '<label class="chk"><input type="checkbox" data-bind="req"' + (opts.requireAll ? ' checked' : '') + '> Every selected sticker must be placed</label>' +
      (solving ? '<button class="primary" data-a="cancel" style="background:#e5645b;border-color:#e5645b">Cancel</button>' : '<button class="primary" data-a="solve">SOLVE</button>');
  }

  function statValue(s, name) {
    return s.totals[name] || 0;
  }

  // Highest Stats is a lexicographic objective: #1 is maximized first,
  // then #2 only breaks ties, and so on.
  function highestStatsCompare(a, b) {
    var priority = state.statPriority || [];
    for (var i = 0; i < priority.length; i++) {
      var av = statValue(a, priority[i]), bv = statValue(b, priority[i]);
      if (Math.abs(av - bv) > 1e-4) return bv - av;
    }
    return b.balance - a.balance || b.highestStat - a.highestStat || b.raritySum - a.raritySum;
  }

  var CMP = [
    highestStatsCompare,
    function (a, b) { return b.balance - a.balance || b.highestStat - a.highestStat || b.raritySum - a.raritySum; },
    // Highest Rarity: ties fall back to the Highest Stats ordering (stat priority list).
    function (a, b) { return b.epicCount - a.epicCount || b.rareCount - a.rareCount || b.commonCount - a.commonCount || highestStatsCompare(a, b); }
  ];

  // Overall Best: sum of each solve's placement in the three categories (lowest total wins)
  function rankAll() {
    results.forEach(function (s) { s.score = 0; });
    CMP.forEach(function (c) { results.slice().sort(c).forEach(function (s, i) { s.score += 1 / (i + 1); }); });
  }

  function sorted() {
    var r = results.slice();
    r.sort(sortMode === 0
      ? function (a, b) { return b.score - a.score || CMP[0](a, b); }
      : CMP[sortMode - 1]);
    return r.slice(0, 10);
  }

  function summary(s) {
    var parts = Object.keys(s.totals).concat(Object.keys(s.descriptive)).map(function (n) {
      var v = n in s.totals ? s.totals[n] : s.descriptive[n];
      return EFFECTS[n] ? tierText(EFFECTS[n], v) : statText(n, v);
    });
    return (parts.join('  |  ') || '(no stats)') + '\nBalance ' + fmt(s.balance) + '   Top stat ' + fmt(s.highestStat) + '   Rarity ' + s.raritySum + '   Stickers ' + s.placed.length;
  }

  function describe(p) {
    var d = p.def;
    if (d.isLamp) return d.name + ' [' + RAR[d.rarity - 1] + ' Glow Up]: ' + fmt(p.lampBoost) + '% Effectiveness';
    return d.name + ' [' + RAR[d.rarity - 1] + ']: ' + d.effects.slice(0, d.rarity).map(function (e, i) {
      if (i > 0) return tierOne(EFFECTS[e.stat]);
      var t = fmt(p.commonValue) + '% ' + e.stat;
      if (p.multiplier > 1.0001) t += ' (base ' + fmt(e.value) + ', x' + fmt(p.multiplier) + ' from Glow Ups)';
      return t;
    }).join(', ');
  }

  function renderResults() {
    if (!results.length) { $('results').innerHTML = ''; return; }
    var list = sorted(); if (sel >= list.length) sel = 0;
    var h = '<div class="seg">' + SORTS.map(function (n, i) { return '<button data-a="sort" data-v="' + i + '" class="' + (sortMode === i ? 'on' : '') + '">' + n + '</button>'; }).join('') + '</div><div id="list">';
    list.forEach(function (s, i) { h += '<button class="sol ' + (i === sel ? 'sel' : '') + '" data-a="pick" data-i="' + i + '">#' + (i + 1) + '   ' + esc(summary(s)) + (sortMode === 0 ? esc('\nOverall score ' + s.score.toFixed(3)) : '') + '</button>'; });
    h += '</div>';
    var s = list[sel], owner = Array(30).fill(-1);
    s.placed.forEach(function (p, pi) { p.cells.forEach(function (c) { owner[c] = pi; }); });
    h += '<h2>Selected solution</h2><div class="grid" style="grid-template-columns:repeat(6,44px)">';
    for (var i = 0; i < 30; i++) {
      var o = owner[i], bg = !state.sheet[i] ? '#23262e' : o < 0 ? '#b9bdc7' : color(s.placed[o], o);
      h += '<div class="cell" style="width:44px;height:44px;background:' + bg + '">' + (o >= 0 ? (o + 1) : '') + '</div>';
    }
    h += '</div><div style="margin:8px 0">' + esc(summary(s)).replace(/\n/g, '<br>') + '</div>';
    s.placed.forEach(function (p, pi) {
      h += '<div class="legend"><div class="cell" style="background:' + color(p, pi) + '">' + (pi + 1) + '</div><div>' + esc(describe(p)) + '</div></div>';
    });
    $('results').innerHTML = h;
  }

  function renderAll() { renderForm(); rendersheet(); renderStickers(); renderResults(); }

  // ---------- actions ----------
  function createSticker() {
    var p = preset(form.type);
    if (!p) return setStatus('Pick a sticker first.');
    var v = parseFloat(form.val);
    if (p.lamp) { if (!(v > 0)) return setStatus('Effectiveness must be a number above 0.'); }
    else if (!(v >= 0)) return setStatus('Enter the ' + p.base + ' % value (0 or more).');
    state.counters[p.name] = (state.counters[p.name] || 0) + 1;
    var st = { type: p.name, rarity: form.rarity, value: v, include: true, name: p.name + ' ' + state.counters[p.name] };
    state.stickers.push(st); normalizeStatPriority(); form.val = ''; save(); renderAll(); setStatus('Created sticker \'' + st.name + '\'.');
  }

  function finish(res) {
    solving = false; worker = null;
    results = res.solutions.map(function (s) { s.placed.forEach(function (p) { p.def = lastStickers[p.sticker]; }); return s; });
    rankAll(); sel = 0;
    if (!results.length) setStatus('No placement exists: the selected stickers can\'t all fit on the sticker sheet.');
    else setStatus(results.length + ' solution(s) found (' + res.nodes.toLocaleString() + ' search steps). Showing the top 10 per category.' + (res.truncated ? ' Search limit reached, so the list may be incomplete.' : ''));
    renderAll();
  }

  var lastStickers = [];
  function startSolve() {
    var instances = [];
    state.stickers.forEach(function (s, i) { if (s.include) instances.push(i); });
    if (!instances.length) return setStatus('Select at least one sticker to place.');
    lastStickers = state.stickers.map(solverDef);
    // Base common stats are the optimization dimensions. Rare/epic effects
    // are still sent to the solver and accumulated for display, but do not
    // create extra Pareto dimensions.
    var stats = [], seen = {};
    instances.forEach(function (i) {
      lastStickers[i].effects.forEach(function (e, k) {
        if (seen[e.stat]) return;
        seen[e.stat] = 1;
        stats.push({
          name: e.stat,
          numerical: k === 0 || EFFECTS[e.stat].stack,
          optimize: k === 0
        });
      });
    });
    var input = JSON.parse(JSON.stringify({
      stats: stats,
      stickers: lastStickers,
      sheet: state.sheet,
      instances: instances,
      requireAll: opts.requireAll
    }));
    results = []; solving = true; setStatus('Solving...'); renderAll();
    var runSync = function () { setTimeout(function () { finish(solve(input)); }, 20); };
    if (typeof Worker === 'undefined') return runSync();
    try {
      worker = new Worker(URL.createObjectURL(new Blob(['var solve=' + solve.toString() + ';self.onmessage=function(e){self.postMessage(solve(e.data));};'], { type: 'text/javascript' })));
      worker.onmessage = function (e) { finish(e.data); };
      worker.onerror = function () { worker = null; runSync(); };
      worker.postMessage(input);
    } catch (e) { worker = null; runSync(); }
  }

  function act(a, d) {
    var i = +d.i, v = d.v;
    if (a === 'formRarity') { form.rarity = +v; renderForm(); }
    else if (a === 'createSticker') createSticker();
    else if (a === 'sheet') { state.sheet[i] = !state.sheet[i]; save(); rendersheet(); }
    else if (a === 'sheetAll') { state.sheet = Array(30).fill(true); save(); rendersheet(); }
    else if (a === 'toggle') { state.stickers[i].include = !state.stickers[i].include; save(); renderStickers(); }
    else if (a === 'delSticker') { state.stickers.splice(i, 1); normalizeStatPriority(); save(); renderAll(); }
    else if (a === 'solve') startSolve();
    else if (a === 'cancel') { if (worker) worker.terminate(); worker = null; solving = false; setStatus('Cancelled.'); renderStickers(); }
    else if (a === 'sort') { sortMode = +v; sel = 0; renderResults(); }
    else if (a === 'pick') { sel = i; renderResults(); }
  }

  function onField(e) {
    var t = e.target, b = t.dataset && t.dataset.bind;
    if (!b) return;
    if (b === 'preset') { if (e.type === 'change') { form.type = t.value; form.val = ''; renderForm(); } }
    else if (b === 'val') form.val = t.value;
    else if (b === 'req') opts.requireAll = t.checked;
  }

  var draggedPriority = null;
  var draggedPriorityItem = null;
  var draggedPriorityClone = null;
  var dragOffsetY = 0;
  var dragCurrentY = 0;
  var dragPointerId = null;

  function updatePriorityRanks() {
    document.querySelectorAll('#priority-list .priority-item').forEach(function (item, i) {
      var rank = item.querySelector('.priority-rank');
      if (rank) rank.textContent = '#' + (i + 1);
    });
  }

  function priorityOrderFromDom() {
    return Array.prototype.slice.call(document.querySelectorAll('#priority-list .priority-item'))
      .map(function (item) { return item.dataset.priority; });
  }

  function animatePriorityMove(dragged, target, before) {
    var list = $('priority-list');
    if (!list || !dragged || !target || dragged === target) return false;

    var items = Array.prototype.slice.call(list.querySelectorAll('.priority-item'));
    var first = new Map();
    items.forEach(function (item) { first.set(item, item.getBoundingClientRect()); });

    if (before) list.insertBefore(dragged, target);
    else list.insertBefore(dragged, target.nextSibling);

    var moved = false;
    items.forEach(function (item) {
      if (item === dragged) return;
      var oldRect = first.get(item);
      var newRect = item.getBoundingClientRect();
      var dy = oldRect.top - newRect.top;

      if (Math.abs(dy) > 0.5) {
        moved = true;
        item.style.transition = 'none';
        item.style.transform = 'translateY(' + dy + 'px)';
        requestAnimationFrame(function () {
          item.style.transition = 'transform 160ms ease';
          item.style.transform = '';
        });
      }
    });

    updatePriorityRanks();
    if (draggedPriorityClone) {
      var draggedIndex = Array.prototype.indexOf.call(list.querySelectorAll('.priority-item'), dragged);
      var cloneRank = draggedPriorityClone.querySelector('.priority-rank');
      if (cloneRank && draggedIndex >= 0) cloneRank.textContent = '#' + (draggedIndex + 1);
    }
    return moved;
  }

  function createPriorityDragClone(item) {
    var rect = item.getBoundingClientRect();
    var clone = item.cloneNode(true);
    clone.classList.add('priority-drag-clone');
    clone.removeAttribute('draggable');
    clone.style.position = 'fixed';
    clone.style.left = rect.left + 'px';
    clone.style.top = rect.top + 'px';
    clone.style.width = rect.width + 'px';
    clone.style.height = rect.height + 'px';
    clone.style.margin = getComputedStyle(item).margin;
    clone.style.boxSizing = 'border-box';
    clone.style.zIndex = '9999';
    clone.style.pointerEvents = 'none';
    clone.style.cursor = 'grabbing';
    clone.style.transform = 'translateY(0)';
    document.body.appendChild(clone);
    return clone;
  }

  function finishPriorityDrag() {
    if (!draggedPriorityItem) return;

    var item = draggedPriorityItem;
    var clone = draggedPriorityClone;

    state.statPriority = priorityOrderFromDom();
    save();
    renderResults();

    if (clone) clone.remove();
    item.style.visibility = '';
    item.style.pointerEvents = '';
    item.classList.remove('dragging');

    draggedPriority = null;
    draggedPriorityItem = null;
    draggedPriorityClone = null;
    dragPointerId = null;
  }

  document.addEventListener('pointerdown', function (e) {
    var item = e.target.closest ? e.target.closest('.priority-item') : null;
    if (!item || e.button !== 0) return;

    var list = $('priority-list');
    if (!list || !list.contains(item)) return;

    e.preventDefault();
    draggedPriority = item.dataset.priority;
    draggedPriorityItem = item;
    dragPointerId = e.pointerId;

    var rect = item.getBoundingClientRect();
    dragOffsetY = e.clientY - rect.top;
    dragCurrentY = e.clientY;

    draggedPriorityClone = createPriorityDragClone(item);
    item.classList.add('dragging');
    item.style.visibility = 'hidden';
    item.style.pointerEvents = 'none';

    item.setPointerCapture?.(e.pointerId);
  });

  document.addEventListener('pointermove', function (e) {
    if (!draggedPriorityItem || e.pointerId !== dragPointerId) return;
    e.preventDefault();

    var list = $('priority-list');
    if (!list) return;

    // Give the pointer some leeway beyond the list so the first and last
    // slots are easy to reach. The dragged element may extend slightly
    // outside the list while the pointer is in this leeway area.
    var listRect = list.getBoundingClientRect();
    var itemRect = draggedPriorityClone ? draggedPriorityClone.getBoundingClientRect() : draggedPriorityItem.getBoundingClientRect();
    var minPointerY = listRect.top;
    var maxPointerY = listRect.bottom;
    var boundedPointerY = Math.max(minPointerY, Math.min(e.clientY, maxPointerY));
    dragCurrentY = boundedPointerY;

    if (draggedPriorityClone) {
      draggedPriorityClone.style.top = (boundedPointerY - dragOffsetY) + 'px';
    }

    // Temporarily show the hidden item's original layout position while
    // calculating the slot, without letting it participate visually.
    var elements = Array.prototype.slice.call(list.querySelectorAll('.priority-item'))
      .filter(function (x) { return x !== draggedPriorityItem; });

    var target = null;
    var before = true;

    for (var i = 0; i < elements.length; i++) {
      var rect = elements[i].getBoundingClientRect();
      var midpoint = rect.top + rect.height / 2;
      if (boundedPointerY < midpoint) {
        target = elements[i];
        before = true;
        break;
      }
    }

    if (!target && elements.length) {
      target = elements[elements.length - 1];
      before = false;
    }

    if (target) {
      animatePriorityMove(draggedPriorityItem, target, before);
      state.statPriority = priorityOrderFromDom();
      draggedPriorityItem.style.visibility = 'hidden';
    }
  });

  document.addEventListener('pointerup', function (e) {
    if (!draggedPriorityItem || e.pointerId !== dragPointerId) return;
    finishPriorityDrag();
  });

  document.addEventListener('pointercancel', function (e) {
    if (!draggedPriorityItem || e.pointerId !== dragPointerId) return;
    finishPriorityDrag();
  });

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-a]') : null;
    if (t) act(t.dataset.a, t.dataset);
  });
  document.addEventListener('input', onField);
  document.addEventListener('change', onField);

  renderAll();
  window.__stickerApp = { act: act, state: function () { return state; }, form: form, opts: opts, results: function () { return results; }, status: function () { return statusMsg; }, isSolving: function () { return solving; } };
})();
</script>
</body>
